[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sumy"
version = "0.3.0"
description = "Module for automatic summarization of text documents and HTML pages."
authors = [{name = "Michal Belica", email = "miso.belica@gmail.com"}]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "docopt-ng>=0.9.0",
    "readability-lxml>=0.8.4",
    "nltk>=3.9.4",
]
keywords = [
    "data mining",
    "automatic summarization",
    "data reduction",
    "web-data extraction",
    "NLP",
    "natural language processing",
    "latent semantic analysis",
    "LSA",
    "TextRank",
    "LexRank",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Czech",
    "Natural Language :: Slovak",
    "Natural Language :: English",
    "Natural Language :: German",
    "Natural Language :: French",
    "Topic :: Education",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: HTML",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["readme"]

[project.optional-dependencies]
lsa = ["numpy>=2.0"]
lexrank = ["numpy>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/miso-belica/sumy"

[project.scripts]
sumy = "sumy.__main__:main"
sumy_eval = "sumy.evaluation.__main__:main"

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
sumy = ["data/stopwords/*.txt"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGELOG.rst"], content-type = "text/x-rst"}

[tool.pytest.ini_options]
addopts = "--quiet --tb=short --color=yes --no-cov-on-fail"

[tool.ruff]
target-version = "py313"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
