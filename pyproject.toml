[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sumy"
version = "0.3.0"
description = "Module for automatic summarization of text documents and HTML pages."
readme = "README.rst"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Michal Belica", email = "miso.belica@gmail.com" }]
keywords = [
    "data mining",
    "automatic summarization",
    "data reduction",
    "web-data extraction",
    "NLP",
    "natural language processing",
    "latent semantic analysis",
    "LSA",
    "TextRank",
    "LexRank",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Czech",
    "Natural Language :: Slovak",
    "Natural Language :: English",
    "Natural Language :: German",
    "Natural Language :: French",
    "Topic :: Education",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: HTML",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "docopt-ng",
    "nltk>=3.9",
    "breadability",
    "lxml",
    "requests",
]

[project.optional-dependencies]
LSA = ["numpy"]
LexRank = ["numpy"]
dev = ["pytest", "pytest-cov", "ruff", "numpy"]

[project.urls]
Homepage = "https://github.com/miso-belica/sumy"

[project.scripts]
sumy = "sumy.__main__:main"
sumy_eval = "sumy.evaluation.__main__:main"

[tool.setuptools.packages.find]
include = ["sumy*"]

[tool.setuptools.package-data]
sumy = ["data/stopwords/*.txt"]

[tool.pytest.ini_options]
addopts = "--quiet --tb=short"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
